    <!-- Anti-flicker Dark/Light Theme Sync & Transparent Favicon -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('velgrid_theme') || localStorage.getItem('velmora_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && systemDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
          var fav = document.getElementById('app-favicon');
          if (fav) {
            fav.href = isDark ? '/favicon-dark.png' : '/favicon-light.png';
          }
        } catch (e) {}
      })();
    </script>
